name: Build Android APK

# Builds a signed release APK any time you push to main, or manually
# from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing keystore
        # If you've saved a RELEASE_KEYSTORE_BASE64 secret (recommended, see
        # README-BUILD.md), that keystore is reused every build so updates
        # install cleanly over old versions.
        # If no secret is set, a fresh keystore is generated automatically
        # so the very first build still produces an installable APK.
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release.keystore
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore android/app/keystore/release.keystore \
              -alias bitbunker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass bitbunker123 -keypass bitbunker123 \
              -dname "CN=Bit Bunker, OU=Arcade, O=Bit Bunker, L=NA, S=NA, C=US"
            echo "RELEASE_KEYSTORE_PASSWORD=bitbunker123" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=bitbunker" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=bitbunker123" >> $GITHUB_ENV
          fi
          echo "RELEASE_KEYSTORE_PATH=keystore/release.keystore" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bit-bunker-arcade-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release with APK attached
        # Only runs on pushes to main, not manual test runs, and only if
        # there isn't already a release for this exact commit.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bit Bunker Arcade APK (build ${{ github.run_number }})
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            Auto-built APK from commit ${{ github.sha }}.
            Download `app-release.apk` below and install it on Android
            (you may need to tap "install anyway" past the unknown-source
            prompt — that's normal for apps outside the Play Store).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
