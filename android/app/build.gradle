apply plugin: 'com.android.application'

/* ---------------------------------------------------------------------------
   Release signing (needed to upload to Google Play)
   The keystore details are NEVER written in this file. They are read from
   either:
     1. android/keystore.properties   (for building on your own computer)
     2. environment variables         (for GitHub Actions - see build-aab.yml)

   keystore.properties format:
       storeFile=C:/keys/pixelarcade-upload.jks
       storePassword=your-store-password
       keyAlias=upload
       keyPassword=your-key-password
   --------------------------------------------------------------------------- */
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String propKey, String envKey ->
    keystoreProps.getProperty(propKey) ?: System.getenv(envKey)
}
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
def releaseStorePassword = signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
def appVersionCode = (project.findProperty('VERSION_CODE') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('VERSION_NAME') ?: '1.0').toString()
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "app.web.pixel_arcade.twa"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.web.pixel_arcade.twa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Google Play requires versionCode to go UP with every upload.
        // Pass -PVERSION_CODE=2 (or 3, 4...) when building, or edit the default below.
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
