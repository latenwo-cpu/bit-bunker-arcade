<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgh" cx="30%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#1a2140"/>
      <stop offset="65%" stop-color="#0b0e1a"/>
    </radialGradient>
    <linearGradient id="ringh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2de2c8"/>
      <stop offset="100%" stop-color="#ff3e9d"/>
    </linearGradient>
    <linearGradient id="stickh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffb400"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2de2c8"/>
      <stop offset="100%" stop-color="#ff3e9d"/>
    </linearGradient>
    <filter id="glowh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="url(#bgh)" rx="20"/>

  <!-- icon mark -->
  <g transform="translate(130,130)">
    <circle r="92" fill="none" stroke="url(#ringh)" stroke-width="10" filter="url(#glowh)"/>
    <g fill="#8892b8">
      <circle cx="0" cy="-92" r="5"/>
      <circle cx="0" cy="92" r="5"/>
      <circle cx="-92" cy="0" r="5"/>
      <circle cx="92" cy="0" r="5"/>
      <circle cx="-65" cy="-65" r="4.5"/>
      <circle cx="65" cy="-65" r="4.5"/>
      <circle cx="-65" cy="65" r="4.5"/>
      <circle cx="65" cy="65" r="4.5"/>
    </g>
    <circle r="72" fill="#141a30" stroke="#2a3363" stroke-width="2.5"/>
    <g filter="url(#glowh)">
      <rect x="-14" y="-40" width="28" height="44" rx="12" fill="url(#stickh)"/>
      <circle cy="-44" r="17" fill="url(#stickh)"/>
      <rect x="-38" y="24" width="76" height="17" rx="7" fill="#2de2c8"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="260" y="128" font-family="'Courier New', monospace" font-weight="700" font-size="72" letter-spacing="4" fill="url(#textGrad)" filter="url(#glowh)">BIT BUNKER</text>
  <text x="262" y="172" font-family="'Courier New', monospace" font-weight="600" font-size="26" letter-spacing="12" fill="#ffb400">A R C A D E</text>

  <!-- underline blip -->
  <rect x="262" y="188" width="420" height="4" fill="#2a3363"/>
  <rect x="262" y="188" width="140" height="4" fill="#ff3e9d"/>
</svg>
